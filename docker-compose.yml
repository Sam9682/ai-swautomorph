version: '3.8'

services:
  ai-swautomorph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-swautomorph-app
    ports:
      - "${PORT:-6001}:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    volumes:
      - app_data:/app/data
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://www.swautomorph.com:5000/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ai-swautomorph-nginx
    ports:
      - "${HTTPS_PORT:-6002}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-swautomorph
    restart: unless-stopped
    environment:
      - PORT=${PORT:-6001}
      - HTTPS_PORT=${HTTPS_PORT:-6002}
volumes:
  app_data: