version: '3.8'

services:
  ai-swautomorph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-swautomorph-app
    ports:
      - "${HTTP_PORT:-6000}:80"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    volumes:
      - app_data:/app/data
      - ~/.ssh:/home/ubuntu/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ai-swautomorph-nginx
    ports:
      - "${HTTPS_PORT:-6001}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-swautomorph
    restart: unless-stopped
    environment:
      - HTTP_PORT=${HTTP_PORT:-6000}
      - HTTPS_PORT=${HTTPS_PORT:-6001}
volumes:
  app_data: