{% extends "base.html" %}

{% block title %}{{ get_text('register') }} - AI-SwAutoMorph{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>{{ get_text('register') }}</h2>
        <form id="registerForm" method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">{{ get_text('username') }}:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">{{ get_text('email') }}:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="first_name">{{ get_text('first_name') }}:</label>
                <input type="text" id="first_name" name="first_name">
            </div>
            <div class="form-group">
                <label for="last_name">{{ get_text('last_name') }}:</label>
                <input type="text" id="last_name" name="last_name">
            </div>
            <div class="form-group">
                <label for="password">{{ get_text('password') }}:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ get_text('register') }}</button>
        </form>
        <p class="auth-link">
            {{ get_text('already_account') }} <a href="{{ url_for('index') }}">{{ get_text('login_here') }}</a>
        </p>
    </div>
</div>
{% endblock %}
