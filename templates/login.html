{% extends "base.html" %}

{% block title %}{{ get_text('login') }} - AI-SwAutoMorph{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>{{ get_text('login') }}</h2>
        <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">{{ get_text('username') }}:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">{{ get_text('password') }}:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ get_text('login') }}</button>
        </form>
        <p class="auth-link">
            {{ get_text('no_account') }} <a href="{{ url_for('auth.register') }}">{{ get_text('register_here') }}</a>
        </p>
    </div>
</div>
{% endblock %}
