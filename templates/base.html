<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-SwAutoMorph{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">AI-SwAutoMorph</h1>
            <div class="nav-center">
                <div class="nav-links">
                    {% if session.user_id %}
                        {% if username %}<span class="nav-user">{{ get_text('welcome') }}, {{ username }}</span>{% endif %}
                        <a href="{{ url_for('main.dashboard') }}">{{ get_text('dashboard') }}</a>
                        <a href="{{ url_for('main.docs') }}">DOCS</a>
                        <a href="{{ url_for('auth.logout') }}">{{ get_text('logout') }}</a>
                    {% else %}
                        <a href="{{ url_for('main.docs') }}">DOCS</a>
                        <a href="{{ url_for('main.index') }}">{{ get_text('login') }}</a>
                    {% endif %}
                </div>
            </div>
            <div class="lang-toggle">
                <a href="{{ url_for('main.set_language', language='en') }}" class="lang-btn {% if current_lang == 'en' %}active{% endif %}">EN</a>
                <a href="{{ url_for('main.set_language', language='fr') }}" class="lang-btn {% if current_lang == 'fr' %}active{% endif %}">FR</a>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
